# Runs on every push and pull request:
#   1. backend and frontend tests (CI)
# and on pushes to main only:
#   2. builds the two Docker images and stores them in GitHub's registry
#   3. deploys them to the server, once the repository variable
#      DEPLOY_ENABLED is "true" (see the push-to-prod guide)
name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels an older run that's still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      # Tests that need a built graph skip themselves; the rest run.
      - run: uv run pytest -q
      - run: uv run python manage.py check
        env:
          DJANGO_DEBUG: "true"

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  images:
    name: Build and store images
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image == 'web' && 'frontend' || 'backend' }}
          push: true
          # "latest" is what the server runs; the commit id tag lets you roll back.
          tags: |
            ghcr.io/${{ github.repository_owner }}/walker-${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/walker-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to the server
    needs: images
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time, and never cancelled halfway.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up the SSH key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Send the latest compose file
        run: |
          scp -i ~/.ssh/deploy_key docker-compose.yml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:walker/docker-compose.yml"

      - name: Pull the new images and restart
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<'SCRIPT'
          set -euo pipefail
          cd ~/walker
          docker compose pull
          docker compose up -d --remove-orphans
          # Wait up to two minutes for the backend to report healthy.
          for i in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q backend)")
            if [ "$status" = healthy ]; then echo "backend is healthy"; break; fi
            sleep 3
          done
          [ "$status" = healthy ] || { docker compose logs --tail 50 backend; exit 1; }
          # Remove old images so the disk doesn't fill up.
          docker image prune -f
          SCRIPT
