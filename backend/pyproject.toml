[project]
name = "walker-backend"
version = "0.1.0"
description = "Walking-route backend for Walker: graph data, search algorithms and the JSON API"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.2",
    "gunicorn>=26.2.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
build = [
    "osmnx>=2.1.1",
]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "pytest-timeout>=2.4.0",
    { include-group = "build" },
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
testpaths = ["tests"]
# An algorithm stuck in a loop that never yields can't be stopped by the
# runner, so stop the test instead of hanging the whole run.
timeout = 30
