[project]
name = "walker-backend"
version = "0.1.0"
description = "Walking-route backend for Walker: graph data, search algorithms and the JSON API"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.2",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
testpaths = ["tests"]
